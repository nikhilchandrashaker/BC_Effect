Titles(){return `<div class="bar"><input id="tq" placeholder="Search titles, promotions, holders…"></div><div id="tt"></div>`},
Lineage(){return `<h2>Family tree: documented lineage</h2><p class="l">Chains are drawn from the Timeline and Related &amp; Inspired sheets. WWE groups are talent lineage, not official Bullet Club branches.</p>`+TREE.map(c=>`<div class="card"><b>${c[0]}</b><div class="chain">${c[1].map((n,i)=>`${i?'<span class="arr">→</span>':''}<div class="node">${n[0]}<small>${n[1]}</small></div>`).join('')}</div></div>`).join('')+`<h2>Subgroups</h2>`+table(['Subgroup','Members','Tenure','Type','Promotions'],D.s)+`<h2 style="margin-top:18px">Related and inspired groups</h2>`+table(['Promotion','Group','People','Relationship','Why it matters'],D.r)},
Index(){return `<div class="card"><h2>Documented Footprint Index, 2013–2026</h2><p>Each year is scored 0–100 from four measures in your workbook, each scaled so its best year is 1, then combined with the weights below. Move the sliders and see whether the peak year changes.</p>${IDXL.map((l,i)=>`<label style="display:block">${l}: <input type="range" min="0" max="5" value="1" data-i="${i}"></label>`).join('')}<p class="l">Limits: roster counts active members; milestones counts Timeline entries; merch units sums single-year shirt figures (square-root scaled, 2017 dominates); audience peak is the log of the largest attendance or viewer figure that year (mixed units). Titles are excluded because the workbook has no title dates. Years with no data score 0 on that measure, which is a gap, not proof of zero. This shows documented footprint, not causal impact. Two eras compete for the peak: 2017–18 (merchandise, All In) and 2023 (roster size and AEW ratings, the only years with recovered TV data). Try the sliders: the peak flips to 2017 when merch is weighted up or audience is set to 0. The full analysis is in the PDF report.</p></div><div class="card" id="ixo"></div>`},
Gaps(){return table(['Datapoint','Status','Importance','Handling'],D.g)}};
function mt(){const q=($('#q').value||'').toLowerCase(),r=$('#role').value,y=+$('#yy').value;
const L=M.filter(m=>(!q||(m.n+m.pr).toLowerCase().includes(q))&&(!r||m.role===r)&&(!y||active(y).includes(m)));
$('#mt').innerHTML=`<p class="l">${L.length} of ${M.length} entries</p>`+table(['Name','Role','Joined','Left','Promotions','Founder','Notes'],L.map(m=>[m.n,m.role,m.j,m.l,m.pr,m.f?'Yes':'',m.note]))}
function tt(){const q=($('#tq').value||'').toLowerCase();const L=D.c.filter(r=>r.join(' ').toLowerCase().includes(q));$('#tt').innerHTML=`<p class="l">${L.length} entries</p>`+table(['Promotion','Title / accomplishment','Type','Count','Holder(s)','Disclosure'],L)}
const key=n=>{const w=n.replace(/[“"][^”"]*[”"]/g,'').trim().split(/\s+/);return (w[0]+' '+w[w.length-1]).toLowerCase()};
function prof(e){const td=e.target.closest('td');if(!td||td.cellIndex!==0)return;const nm=td.textContent,m=M.find(x=>x.n===nm);if(!m)return;const k=key(nm);
const subs=D.s.filter(r=>r[1].split(';').some(p=>key(p.trim())===k)),ti=D.c.filter(r=>r[4].split(/&|,|;| and /).some(p=>key(p.trim())===k));
$('#pf').innerHTML=`<div class="card"><h2>${esc(nm)}${m.f?' <span class="tag">Founder</span>':''}</h2><p><b>${esc(m.role)}</b> · ${esc(m.j)} to ${esc(m.l||'present')} · ${esc(m.pr)}${m.note?' · '+esc(m.note):''}</p><b>Subgroups (${subs.length})</b>${subs.length?'<ul>'+subs.map(r=>`<li>${esc(r[0])} <span class="tag">${esc(r[2])}</span></li>`).join('')+'</ul>':'<p class="l">None listed.</p>'}<b>Titles and awards (${ti.length})</b>${ti.length?'<ul>'+ti.map(r=>`<li>${esc(r[1])} <span class="tag">${esc(r[0])}</span></li>`).join('')+'</ul>':'<p class="l">None matched by name in the Titles sheet.</p>'}<p class="l">Matched by first and last name, so check unusual spellings against the Titles tab.</p></div>`;$('#pf').scrollIntoView({behavior:'smooth',block:'nearest'})}
const IDXL=['Roster size','Milestones','Merch units','Audience peak'];
function comps(){const Y=[...Array(14)].map((_,i)=>2013+i),nm=a=>{const m=Math.max(...a)||1;return a.map(x=>x/m)},num=r=>r[4]!==''&&!isNaN(+r[4]);
return{Y,C:[nm(Y.map(y=>active(y).length)),nm(Y.map(y=>D.t.filter(r=>yr(r[0])===y).length)),nm(Y.map(y=>Math.sqrt(D.mer.filter(r=>/^\d{4}(-\d\d)?$/.test(r[2])&&yr(r[2])===y&&r[5]==='shirts'&&num(r)).reduce((s,r)=>s+ +r[4],0)))),nm(Y.map(y=>{const v=D.a.filter(r=>yr(r[2])===y&&num(r)).map(r=>+r[4]);return v.length?Math.log10(Math.max(...v)):0}))]}}
function idx(){const w=[...document.querySelectorAll('[data-i]')].map(x=>+x.value),{Y,C}=comps(),tw=w.reduce((a,b)=>a+b,0)||1,S=Y.map((y,i)=>100*C.reduce((s,c,k)=>s+w[k]*c[i],0)/tw),pk=S.indexOf(Math.max(...S)),W=640,H=200,bw=W/14;
$('#ixo').innerHTML=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="Index by year">${S.map((s,i)=>`<rect x="${i*bw+6}" y="${H-s*H/100}" width="${bw-12}" height="${s*H/100}" rx="3" fill="${i===pk?'var(--ac2)':'var(--ac)'}"/><text x="${i*bw+bw/2}" y="${H-s*H/100-4}" text-anchor="middle" font-size="11" fill="var(--tx)">${Math.round(s)}</text><text x="${i*bw+bw/2}" y="${H+16}" text-anchor="middle" font-size="11" fill="var(--mut)">${Y[i]}</text>`).join('')}</svg><p><b>Peak under these weights: ${Y[pk]}</b> (gold bar).</p>`+table(['Year',...IDXL],Y.map((y,i)=>[y,...C.map(c=>c[i].toFixed(2))]))}
function go(t){cur=t;history.replaceState(null,'','#'+t);$('#nav').innerHTML=tabs.map(x=>`<button class="${x===t?'on':''}" data-t="${x}">${x}</button>`).join('');$('#v').innerHTML=V[t]();
if(t==='Members'){['#q','#role','#yy'].forEach(s=>$(s).addEventListener('input',mt));mt();$('#mt').addEventListener('click',prof)}if(t==='Titles'){$('#tq').addEventListener('input',tt);tt()}if(t==='Index'){document.querySelectorAll('[data-i]').forEach(x=>x.addEventListener('input',idx));idx()}}
$('#nav').addEventListener('click',e=>{if(e.target.dataset.t)go(e.target.dataset.t)});
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(tabs.includes(t)&&t!==cur)go(t)});
go(cur);
</script></body></html>
